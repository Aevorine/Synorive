# Synorive 打包配置
# ====================================================================
# ⚠️ electron-builder 26 的坑（本机实测版本 26.15.3，台账里记着）：
#    **必须用 `signExecutable: false`，不能用 `signAndEditExecutable: false`。**
#    后者在 24 上只跳过签名，26 起把「签名 + 资源编辑」一起关掉 ——
#    结果打出来的 exe 顶着 ProductName=Electron / CompanyName=GitHub, Inc.
#    和默认图标，而且构建**完全不报错**。
#
# 另一个坑：portable 和 nsis 是两个独立目标。NSIS 报错完全不影响 portable 产出，
# 所以"构建成功"的日志天天有，安装包却可能从来没成功过。要分别核对产物。

appId: com.synorive.desktop
productName: Synorive
copyright: Copyright © 2026 Synorive

# electron-builder 要精确版本 —— package.json 里写的是 ^41.0.0 这种范围，
# 它没法据此去下对应平台的二进制。这里写实装版本（node -e 打印出来的那个）。
# 升级 Electron 时**这里也要同步改**，不然会打出版本不一致的包。
electronVersion: 41.10.3

directories:
  output: ../../release
  buildResources: resources

files:
  - out/**/*
  - resources/icons/**/*
  - package.json

# 引擎不打进 asar —— Python 要能直接读到自己的文件
asar: true
asarUnpack:
  - resources/icons/**/*

# 🔴 引擎**源码**随包分发（不含 .venv 和模型）—— 这是「引擎总是启动失败」
# 那件事的打包侧根治。
#
# 原来的判断是"引擎不打进安装包，走依赖医生按需装"，那对**依赖和模型**是对的
# （加起来 800MB+）。但它被顺带套用到了**源码**上，而源码只有 1.2 MB ——
# 结果打包版里根本没有 synorive 这个包，装了它的机器上什么解释器都救不了：
# 找得到 Python 也没有东西可跑。安装包 101 → 约 102 MB，可以忽略。
#
# 有了源码，首次运行就能自己建 venv + pip install（见 main/bootstrap.ts），
# 这才是「可以自动配置需要的工具与内容」在这条链路上的落地。
extraResources:
  # 🔴 **随包分发的 Python 运行时 —— 「独立可执行文件」就靠这一条。**
  #
  # 没有它的时候，装完之后还得：机器上有 Python + 版本 ≥3.11 + 能连上 pip 源。
  # 这三个条件断任何一个，用户看到的都是同一句「引擎启动失败」，
  # 而且**装的时候一切正常，点开才炸**。
  #
  # 由 `node scripts/bundle-python.mjs` 在构建前生成（见 package.json 的 prepack:runtime）。
  # 目录不存在时 electron-builder 会直接报错退出 —— 这是**故意的**：
  # 悄悄打出一个缺运行时的包，比构建失败糟糕得多。
  - from: resources/pyruntime
    to: pyruntime
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!.synorive-bundle.json'
  - from: ../../engine
    to: engine
    filter:
      - '**/*'
      - '!.venv/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!.pytest_cache/**'
      - '!.ruff_cache/**'
      - '!*.egg-info/**'

win:
  # 26 起用这个；signAndEditExecutable 会把图标和版本信息一起关掉
  signExecutable: false
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # 🔴 **文件名里不能有空格。** 默认名是 `Synorive Setup 0.1.1.exe`，而
  #    electron-builder 写进 `latest.yml` 的是把空格换成连字符的
  #    `Synorive-Setup-0.1.1.exe`，GitHub 上传时又会把空格换成**点**。
  #    三方对不上 → 更新器按 latest.yml 里的名字去下载，得到 404。
  #    这个 404 只有真的点了"下载更新"才会暴露，检查更新那一步一切正常。
  #    直接把空格去掉，三方就永远一致。
  artifactName: Synorive-Setup-${version}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Synorive
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico
  deleteAppDataOnUninstall: false # 索引库是用户的数据，卸载不该删

portable:
  artifactName: Synorive-${version}-portable.exe

# 压缩级别。maximum 比 normal 小约 15%，代价是打包慢一倍。
compression: maximum

# ── U 组 自动更新的分发源 ────────────────────────────────────
#
# 🔴 **三件事缺一个，更新链路就是死的，而且死得很安静：**
#
#  ① 仓库必须是**公开**的。私有仓要在应用里内嵌 GitHub Token 才下得动，
#     等于把 Token 发给每个装了这个应用的人 —— 我们选了转公开这条路。
#
#  ② 每次发布**必须把 `latest.yml` 和 exe 一起传上去**。它是 electron-updater
#     唯一的版本清单。只传 exe 的话，更新器查到的是「已是最新」而不是报错 ——
#     用户永远不会知道有新版，你也永远不会收到 bug 报告。
#
#  ③ Release 的 tag 必须是 `v<version>`（如 v0.1.1），和 package.json 里的
#     version 严格对应。用 `node scripts/release.mjs` 出包就不会错。
#
# ⚠️ **portable 目标不参与自动更新** —— 单文件自解压包运行时在临时目录里，
#    替换不了正在运行的自己。应用里对便携版走 `unsupported` 分支，
#    给一条"去下载页手动换"的路，而不是报错让用户反复重试。
publish:
  provider: github
  owner: Aevorine
  repo: Synorive
  # 只认正式发布，草稿和预发布不推给用户
  releaseType: release
