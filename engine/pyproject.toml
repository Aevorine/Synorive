[project]
name = "synorive-engine"
version = "0.1.7"
description = "Synorive 引擎 —— 多模态并发分析与极速内容检索"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    # ── Web 层 ──────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.28",
    # A16：/api/upload 用 FastAPI 的 File/UploadFile 接安卓端上传的文件，
    # 这俩底层靠 python-multipart 解析 multipart/form-data——没装的话
    # 不报明显的错，是 FastAPI 启动时静默把这个路由标记成不可用
    "python-multipart>=0.0.9",

    # ── 存储 ────────────────────────────────────────────
    "sqlite-vec>=0.1.9",
    # 整库加密（SQLCipher）。**随包带，不做成可选** ——
    # 做成可选的话，用户在设置里打开"资料库加密"，而那台机器上没装这个包，
    # 唯一诚实的行为是拒绝开启并说清楚原因。让一个安全开关的可用性
    # 取决于"你装没装某个包"，是给自己留一个必然会踩的坑。
    # 实测：SQLCipher 4.12 / SQLite 3.51.1，FTS5 和 sqlite-vec 都能在它上面跑。
    "sqlcipher3-wheels>=0.5.7",

    # ── 中文分词（主索引依赖它，不是可选）──────────────
    # 实测：不预分词的话「搜索」「视频」这类两字词命中率为 0
    "jieba>=0.42",
    # 拼音纠错：打 `jiqixuexi` 也能找到「机器学习」。
    # 840 KB 纯 wheel，无二进制依赖 —— 和 usearch 一样属于"小到没有理由不带"。
    # 只在**搜不到东西**的补救路径上用，正常搜索一次都不会碰它。
    "pypinyin>=0.53",

    # ── 推理 ────────────────────────────────────────────
    # 默认 CPU 版。依赖医生里的「启用核显加速」会换成 onnxruntime-directml，
    # 两者互斥（同一个 onnxruntime 命名空间），不能同时装。
    "onnxruntime>=1.20",
    "numpy>=2.0",
    # 🔴 **2026-08-03 补上。漏声明它的后果是：装机版里语义检索整个是死的。**
    # `embedder.py` 和 `reranker.py` 的 load() 里 `from tokenizers import Tokenizer`
    # 是硬导入。开发环境里它作为别人的传递依赖凑巧装上了，所以**开发时一切正常**；
    # 而随包运行时只装声明过的包 —— 打出来的应用加载不了嵌入模型，
    # 界面显示的是「向量模型不可用」，**完全看不出是打包漏了一个包**。
    # 这就是「在我机器上是好的」的标准形态。
    "tokenizers>=0.20",
    # 同批补上。`websearch/engines.py` 的 `_doc()` 里 `from lxml import html`
    # 是硬导入且没有兜底 —— 缺了它，多引擎搜索的 HTML 解析路径直接抛异常，
    # 而外层把引擎异常当成"这家引擎挂了"，表现是**所有 HTML 类引擎全部常年失败**
    "lxml>=5.0",

    # ── 图像 ────────────────────────────────────────────
    "pillow>=11.0",

    # ── 系统 ────────────────────────────────────────────
    "watchdog>=6.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
# E17 端到端加密同步（桌面 ↔ 安卓）
#
# 🔴 **没有它就一律拒绝同步，不做任何降级。**
# 加密这块唯一不能干的事就是"库没装就用个简单办法顶一下" ——
# 自己拼的密码算法跑起来完全正常、不报错、密文看着也像密文，
# 而它根本不安全。这类失败用户永远发现不了。
# KDF 用 stdlib 的 hashlib.scrypt（不需要额外依赖），只有 AES-GCM 要这个包。
sync = [
    "cryptography>=43.0",
]
# 4.22b H1 局域网 TLS（自签证书 + 手机端指纹固定）。
# 和 sync 是同一个包，单列一组是为了让"我只想给局域网加密，不用同步"
# 这个诉求有一条明确的安装命令：pip install -e "engine[lantls]"
# 没装的话 --lan-tls 会**退回明文并在日志里大声报出来**，
# 绝不静默降级 —— "以为加密了其实是明文"比没有这个功能危险得多。
lantls = [
    "cryptography>=43.0",
]
# 文档解析（二期）
docs = [
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "ebooklib>=0.18",
    "trafilatura>=2.0",
]
# 多模态（三期）
media = [
    # 🔴 不是 rapidocr-onnxruntime——那个包名不支持 Python 3.13，
    #    实测已换成 rapidocr 3.9.2（见台账阶段 3 坑 19）。
    #    这里之前还写着旧包名，是文档和实现脱节的又一个例子（坑 28 那一类）
    "rapidocr>=3.9",
    "av>=13.0",
    # 语音转写（`analyze/transcribe.py` 里 `import sherpa_onnx`）。
    # 2026-08-03 补声明 —— 它一直没被写进任何依赖组，
    # 只是碰巧在开发机上装着。归 media 而不是 core：**没有它只是转不了字幕，
    # 视频的场景切分和关键帧照常能用**，属于"少一条检索通路"不是"整个坏掉"。
    "sherpa-onnx>=1.10",
]
# 核显加速（依赖医生一键切换，不要和 onnxruntime 同时装）
gpu = [
    "onnxruntime-directml>=1.20",
]
# 大规模向量检索提速（A17，可选）
ann = [
    "usearch>=2.26",
]
# C5 人脸检测与聚类（可选，默认关，隐私最敏感的一类）
# 模型来源仅限非商业研究用途，见 analyze/face.py 顶部说明
face = [
    "insightface>=1.0",
    "opencv-python>=4.10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
synorive-engine = "synorive.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synorive*"]

[tool.setuptools.package-data]
synorive = ["store/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # 行长交给 formatter
    "RUF001", # 中文注释里的全角标点是有意的
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
