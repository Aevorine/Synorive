<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synorive · 分屏控制舱预览</title><style>
:root{--bg:#eef1f3;--panel:#fff;--ink:#1d2b36;--muted:#72808b;--blue:#28577a;--teal:#2b806e;--orange:#bd6b32;--line:#d7dee3;--serif:SimSun,"宋体",serif;--latin:"Times New Roman",Times,serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18.67px/1.5 var(--serif)}.shell{min-height:100vh;display:grid;grid-template-columns:300px minmax(480px,1fr) 320px;grid-template-rows:68px 1fr 52px;gap:1px;background:var(--line)}header{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font:25px var(--latin);color:var(--blue);letter-spacing:.08em}.headerstat{display:flex;gap:24px;color:var(--muted);font-size:18.67px}.headerstat strong{color:var(--teal);font:20px var(--latin)}section,aside,footer{background:var(--panel)}.queue{padding:22px}.queue h1,.diag h1{font:21px var(--serif);font-weight:400;margin:0 0 18px}.input{padding:14px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:18.67px;margin-bottom:18px}.item{padding:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.item b{font-weight:400}.state{font-size:18.67px;color:var(--teal);white-space:nowrap}.state.wait{color:var(--orange)}.canvas{padding:24px;min-width:0}.canvas h1{font:27px var(--serif);font-weight:400;margin:0 0 12px}.canvas p{color:var(--muted);margin:0 0 18px}.chart{height:calc(100% - 92px);min-height:540px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#fbfdfd,#edf4f5);position:relative;overflow:hidden}.chart svg{width:100%;height:100%}.chart path{fill:none;stroke:#a9bcc6;stroke-width:3;stroke-dasharray:11 9;animation:run 1.2s linear infinite}.chart circle{fill:#fff;stroke:var(--blue);stroke-width:3}.chart text{font-family:var(--serif);font-size:21.33px;fill:var(--ink)}.chart .small{font-size:18.67px;fill:var(--muted)}.diag{padding:22px}.card{border:1px solid var(--line);border-radius:9px;padding:15px;margin-bottom:12px}.card .k{font-size:18.67px;color:var(--muted)}.card .v{font:22px var(--latin);margin-top:3px}.bar{height:8px;background:#e4eaed;border-radius:20px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--teal);width:62%}.warning{border-color:#e5c3aa;background:#fffaf5}.warning .v{color:var(--orange);font-family:var(--serif);font-size:18.67px}footer{grid-column:1/-1;padding:0 24px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:18.67px}.pause{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:7px;font:18.67px var(--serif)}@keyframes run{to{stroke-dashoffset:-40}}@media(max-width:1050px){.shell{grid-template-columns:240px 1fr}.diag{display:none}}@media(max-width:700px){.shell{display:block}.queue{display:none}.canvas{padding:16px}.chart{min-height:440px}footer{padding:14px 16px}}
</style></head><body><div class="shell"><header><div class="brand">Synorive</div><div class="headerstat"><span>引擎 <strong>就绪</strong></span><span>队列 <strong>12</strong></span><span>帧率 <strong>59.8</strong></span></div><button class="pause" onclick="pause()">暂停后台</button></header><section class="queue"><h1>输入与队列</h1><div class="input">把文件、图片、链接拖到这里…</div><div class="item"><b>研究报告.pdf</b><span class="state">已可搜索</span></div><div class="item"><b>会议视频.mp4</b><span class="state wait">转写中</span></div><div class="item"><b>网页快照</b><span class="state">已归档</span></div><div class="item"><b>截图-03.png</b><span class="state wait">等待 OCR</span></div></section><main class="canvas"><h1>当前任务：批量分析如何影响搜索</h1><p>主舞台只显示用户真正需要的路径；诊断信息按需打开。</p><div class="chart"><svg viewBox="0 0 800 600" aria-label="批量分析到搜索的动态路径"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#28577a"/></marker></defs><path d="M125 300 C240 170 310 170 390 300" marker-end="url(#a)"/><path d="M125 340 C240 470 310 470 390 340" marker-end="url(#a)"/><path d="M430 300 C545 170 620 170 700 300" marker-end="url(#a)"/><path d="M430 340 C545 470 620 470 700 340" marker-end="url(#a)"/><circle cx="120" cy="320" r="67"/><circle cx="410" cy="320" r="67"/><circle cx="700" cy="320" r="67"/><text x="120" y="314" text-anchor="middle">输入队列</text><text class="small" x="120" y="343" text-anchor="middle">4 项</text><text x="410" y="314" text-anchor="middle">分析阶段</text><text class="small" x="410" y="343" text-anchor="middle">OCR / 向量</text><text x="700" y="314" text-anchor="middle">可搜索</text><text class="small" x="700" y="343" text-anchor="middle">即时反馈</text></svg></div></main><aside class="diag"><h1>运行状态</h1><div class="card"><div class="k">搜索首屏</div><div class="v">64 ms</div><div class="bar"><i style="width:32%"></i></div></div><div class="card"><div class="k">后台 CPU</div><div class="v">43%</div><div class="bar"><i style="width:43%"></i></div></div><div class="card"><div class="k">本地库</div><div class="v">82,410 条</div></div><div class="card warning"><div class="k">需要关注</div><div class="v">1 项 OCR 等待</div></div></aside><footer><span>方案预览 C · 分屏控制舱方向</span><span>中文 SimSun　·　英文/数字 Times New Roman　·　诊断按需展开</span></footer></div><script>function pause(){document.querySelectorAll('.chart path').forEach(x=>x.style.animationPlayState=x.style.animationPlayState==='paused'?'running':'paused');event.target.textContent=event.target.textContent==='暂停后台'?'继续后台':'暂停后台'}</script></body></html>
