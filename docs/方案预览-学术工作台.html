<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synorive · 学术纸张工作台预览</title>
<style>
:root{--paper:#f8f6f0;--ink:#263443;--muted:#74808d;--line:#d9d5ca;--blue:#2b5578;--red:#a83f35;--green:#39745e;--serif:SimSun,"宋体",serif;--latin:"Times New Roman",Times,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18.67px/1.55 var(--serif);font-family:var(--serif)}.latin,button,.metric{font-family:var(--latin),var(--serif)}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr 300px;grid-template-rows:72px 1fr 46px}.top{grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 30px}.brand{font-size:25px;color:var(--blue);letter-spacing:.08em}.search{flex:1;border:1px solid var(--line);background:#fffdf9;border-radius:8px;padding:13px 18px;color:var(--muted);font:18.67px var(--serif)}.top button{border:0;background:transparent;color:var(--blue);font-size:20px;cursor:pointer}.side{border-right:1px solid var(--line);padding:26px 18px}.side h2{font:20px var(--serif);margin:0 0 20px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:7px;font-size:18.67px;color:var(--ink);cursor:pointer}.nav button.active{background:#e7edf1;color:var(--blue);border-left:3px solid var(--blue)}.main{padding:24px 28px;min-width:0;display:flex;flex-direction:column;gap:18px}.crumb{color:var(--muted);font-size:18.67px}.hero{display:flex;justify-content:space-between;align-items:end}.hero h1{font:28px var(--serif);font-weight:400;margin:0}.hero p{margin:5px 0 0;color:var(--muted);font-size:18.67px}.stage{position:relative;flex:1;min-height:560px;border:1px solid var(--line);border-radius:12px;background:#fcfbf7;overflow:hidden;box-shadow:0 12px 30px #3b4a5010}.stage svg{width:100%;height:100%;min-height:560px}.stage text{font-family:var(--serif);font-size:21.33px;fill:var(--ink)}.stage .small{font-size:18.67px;fill:var(--muted)}.node{cursor:pointer}.node rect{fill:#fffdf9;stroke:var(--blue);stroke-width:2}.node.active rect{fill:#e8f0f4;stroke-width:3}.edge{stroke:#8c9ba4;stroke-width:2;fill:none;marker-end:url(#arrow)}.edge.live{stroke:var(--blue);stroke-dasharray:10 8;animation:flow 1.6s linear infinite}.legend{position:absolute;left:20px;bottom:18px;display:flex;gap:18px;color:var(--muted);font-size:18.67px}.legend i{display:inline-block;width:26px;border-top:2px solid var(--blue);margin-right:6px;vertical-align:middle}.legend i.dash{border-top-style:dashed}.evidence{border-left:1px solid var(--line);padding:26px 22px;background:#fbfaf6}.evidence h2{font:20px var(--serif);margin:0 0 12px}.tag{display:inline-block;padding:3px 8px;border-radius:20px;background:#e7f1eb;color:var(--green);font-size:18.67px}.evidence h3{font:19px var(--serif);font-weight:400;margin:22px 0 8px}.evidence p{margin:0 0 12px;color:#566572}.evidence a{color:var(--blue);text-decoration:none;border-bottom:1px solid #a7bdca}.bottom{grid-column:1/-1;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:var(--muted);font-size:18.67px}.pill{padding:5px 9px;border:1px solid var(--line);border-radius:20px}@keyframes flow{to{stroke-dashoffset:-36}}@media(max-width:1100px){.app{grid-template-columns:180px 1fr}.evidence{display:none}}@media(max-width:760px){.app{display:block}.top{height:auto;padding:18px;flex-wrap:wrap}.side{display:none}.main{padding:18px}.stage,.stage svg{min-height:440px}.bottom{padding:14px 18px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand latin">Synorive</div><div class="search">⌕　搜索内容、来源或结论…</div><button title="打开快捷键">?</button><button title="关闭到托盘">⌄</button></header>
<aside class="side"><h2>研究工作台</h2><nav class="nav"><button class="active">证据总览</button><button>本地检索</button><button>联网核查</button><button>文献抽表</button><button>时间线</button><button>性能状态</button></nav></aside>
<main class="main"><div class="crumb">项目 / 统一索引 / 当前问题</div><div class="hero"><div><h1>一个结论如何变成可回查证据</h1><p>点击节点查看它的输入、状态和原始资料。</p></div><div class="metric"><span class="pill">播放　Ⅱ</span>　<span class="pill">全屏　↗</span></div></div>
<section class="stage"><svg viewBox="0 0 1000 620" role="img" aria-label="证据链流程图"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2b5578"/></marker></defs><path class="edge live" d="M245 312 C340 220 390 220 475 312"/><path class="edge" d="M245 360 C340 455 390 455 475 360"/><path class="edge live" d="M590 312 C690 220 735 220 820 312"/><path class="edge" d="M590 360 C690 455 735 455 820 360"/>
<g class="node active" onclick="selectNode(this,'n1')"><rect x="65" y="260" width="180" height="100" rx="14"/><text x="155" y="302" text-anchor="middle">用户问题</text><text class="small" x="155" y="334" text-anchor="middle">输入 · n1</text></g>
<g class="node" onclick="selectNode(this,'n2')"><rect x="475" y="260" width="180" height="100" rx="14"/><text x="565" y="302" text-anchor="middle">混合召回</text><text class="small" x="565" y="334" text-anchor="middle">关键词 + 语义</text></g>
<g class="node" onclick="selectNode(this,'n3')"><rect x="820" y="260" width="150" height="100" rx="14"/><text x="895" y="302" text-anchor="middle">原文证据</text><text class="small" x="895" y="334" text-anchor="middle">页码 / 时间码</text></g>
<text class="small" x="355" y="180" text-anchor="middle">检索关系 · 导致</text><text class="small" x="355" y="505" text-anchor="middle">低置信时保留原始结果</text><text class="small" x="710" y="180" text-anchor="middle">支持关系 · 可回查</text><text class="small" x="710" y="505" text-anchor="middle">限制关系 · 需复核</text></svg><div class="legend"><span><i class="dash"></i>正在传播</span><span><i></i>已验证路径</span></div></section></main>
<aside class="evidence"><h2>节点详情</h2><span class="tag">用户提供</span><h3 id="detailTitle">用户问题 · n1</h3><p id="detailText">输入进入查询解析器，尚未形成任何事实判断。</p><h3>核对关系</h3><p>→ 进入混合召回<br>类型：数据流<br>状态：待验证</p><h3>原始资料</h3><p><a href="../README.md">项目 README · What it does</a></p><p class="metric">返回节点后保留当前动画状态。</p></aside>
<footer class="bottom"><span>方案预览 A · 字体层级与证据链视觉方向</span><span>图内文字 ≥ 16pt　·　普通 UI ≥ 14pt</span></footer></div>
<script>function selectNode(el,id){document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));el.classList.add('active');const d={n1:['用户问题','输入进入查询解析器，尚未形成任何事实判断。'],n2:['混合召回','关键词与语义通道先分别排序，再以名次融合。'],n3:['原文证据','保存来源、定位信息和支持/限制关系。']}[id];document.querySelector('#detailTitle').textContent=d[0]+' · '+id;document.querySelector('#detailText').textContent=d[1]}</script>
</body></html>
