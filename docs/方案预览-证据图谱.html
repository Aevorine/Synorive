<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synorive · 深色证据图谱预览</title><style>
:root{--bg:#101923;--panel:#172532;--ink:#e7edf0;--muted:#9eabb4;--cyan:#74d6d0;--amber:#e4b66a;--red:#ed8d83;--line:#36505d;--serif:SimSun,"宋体",serif;--latin:"Times New Roman",Times,serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 58% 38%,#1a3540 0,#101923 46%);color:var(--ink);font:18.67px/1.5 var(--serif)}.wrap{min-height:100vh;padding:22px 28px;display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto 1fr auto;gap:18px}.head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.brand{font:26px var(--latin);letter-spacing:.1em;color:var(--cyan)}.head span{color:var(--muted)}.map{position:relative;min-height:720px;border:1px solid var(--line);background:#0c141caa;border-radius:18px;overflow:hidden}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#29404d33 1px,transparent 1px),linear-gradient(90deg,#29404d33 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent)}svg{width:100%;height:100%;min-height:720px}.edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arr)}.edge.active{stroke:var(--cyan);stroke-dasharray:12 10;animation:flow 1.2s linear infinite}.node circle{fill:var(--panel);stroke:var(--cyan);stroke-width:3;filter:drop-shadow(0 0 10px #74d6d055)}.node.warn circle{stroke:var(--amber)}.node.risk circle{stroke:var(--red)}svg text{font-family:var(--serif);font-size:21.33px;fill:var(--ink)}svg .small{font-size:18.67px;fill:var(--muted)}.side{background:#162431e6;border:1px solid var(--line);border-radius:18px;padding:24px}.side h1{font-size:23px;font-weight:400;margin:0 0 8px}.side p{color:var(--muted);margin:0 0 18px}.row{padding:15px 0;border-top:1px solid var(--line)}.label{color:var(--muted);font-size:18.67px}.value{font-size:19px;margin-top:3px}.value.cyan{color:var(--cyan)}.value.amber{color:var(--amber)}.value.red{color:var(--red)}button{font:18.67px var(--serif);color:var(--ink);background:#213744;border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer}footer{grid-column:1/-1;color:var(--muted);display:flex;justify-content:space-between;gap:20px;font-size:18.67px}@keyframes flow{to{stroke-dashoffset:-44}}@media(max-width:900px){.wrap{display:block}.map{margin-bottom:18px;min-height:520px}svg{min-height:520px}footer{margin-top:18px}}
</style></head><body><div class="wrap"><header class="head"><div class="brand">Synorive</div><span>证据图谱　·　冲突材料保持并排</span><div><button onclick="toggle()">暂停动画</button> <button title="全屏">全屏</button></div></header><section class="map"><svg viewBox="0 0 1000 720" aria-label="证据关系图"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#74d6d0"/></marker></defs><path class="edge active" d="M185 360 C300 160 420 150 500 270"/><path class="edge" d="M185 360 C300 560 420 570 500 450"/><path class="edge active" d="M535 270 C680 170 750 220 842 322"/><path class="edge" d="M535 450 C680 560 760 530 842 388"/><g class="node" transform="translate(165 360)"><circle r="74"/><text text-anchor="middle" y="-5">命题</text><text class="small" text-anchor="middle" y="25">C-01</text></g><g class="node" transform="translate(510 270)"><circle r="74"/><text text-anchor="middle" y="-5">原始来源</text><text class="small" text-anchor="middle" y="25">E-12</text></g><g class="node warn" transform="translate(510 450)"><circle r="74"/><text text-anchor="middle" y="-5">限制</text><text class="small" text-anchor="middle" y="25">E-13</text></g><g class="node" transform="translate(855 355)"><circle r="74"/><text text-anchor="middle" y="-5">可核结论</text><text class="small" text-anchor="middle" y="25">K-04</text></g><text class="small" x="320" y="236">支持</text><text class="small" x="320" y="500">限制</text><text class="small" x="675" y="226">推导</text><text class="small" x="675" y="510">冲突保留</text></svg></section><aside class="side"><h1>结论 K-04</h1><p>点击节点，右侧显示被使用的证据和反向关系。</p><div class="row"><div class="label">证据状态</div><div class="value cyan">多源支持</div></div><div class="row"><div class="label">关键关系</div><div class="value">C-01 → E-12 → K-04</div></div><div class="row"><div class="label">限制关系</div><div class="value amber">E-13 未决</div></div><div class="row"><div class="label">原始定位</div><div class="value"><a href="../TECH_ROADMAP.md" style="color:var(--cyan)">TECH_ROADMAP.md</a></div></div><div class="row"><div class="label">反向回查</div><div class="value">被 2 个图节点、1 个公式使用</div></div></aside><footer><span>方案预览 B · 深色证据图谱方向</span><span>动态箭头表示关系传播，不表示数值大小</span></footer></div><script>let running=true;function toggle(){running=!running;document.querySelectorAll('.active').forEach(x=>x.style.animationPlayState=running?'running':'paused');event.target.textContent=running?'暂停动画':'继续动画'}</script></body></html>
